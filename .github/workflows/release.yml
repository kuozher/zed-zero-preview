name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: zero-preview-server-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: zero-preview-server-x86_64-apple-darwin
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: zero-preview-server-x86_64-unknown-linux-musl
            musl_tools: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: zero-preview-server-aarch64-unknown-linux-musl
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: zero-preview-server-x86_64-pc-windows-msvc.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            asset_name: zero-preview-server-aarch64-pc-windows-msvc.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install musl tools
        if: matrix.musl_tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Add Rust target
        if: "!matrix.use_cross"
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.use_cross
        run: cross build --release -p zero-preview-server --target ${{ matrix.target }}

      - name: Build release binary
        if: "!matrix.use_cross"
        run: cargo build --release -p zero-preview-server --target ${{ matrix.target }}

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/zero-preview-server.exe" "dist/${{ matrix.asset_name }}"
          else
            cp "target/${{ matrix.target }}/release/zero-preview-server" "dist/${{ matrix.asset_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
